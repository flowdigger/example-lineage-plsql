pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.flowdigger.gradle.archi') {
                useModule("org.flowdigger.gradle:gradle-archi-plugin:${requested.version}")
            }
        }
    }
    if (file('../gradle-lineage-plugin').isDirectory()) {
        includeBuild('../gradle-lineage-plugin')
    }
}

rootProject.name = 'example-lineage-plsql'

include 'architecture'
include 'application'
include 'lineage'
include 'knowledgeGraph'

project(':architecture').projectDir = file('1-architecture')
project(':application').projectDir = file('2-application')
project(':lineage').projectDir = file('3-lineage')
project(':knowledgeGraph').projectDir = file('4-knowledge-graph')
