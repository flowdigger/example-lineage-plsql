plugins {
    id 'base'
    id 'org.owasp.dependencycheck' apply false
    id 'com.github.spotbugs' apply false

    // Data lineage plugin publishing
    id 'org.flowdigger.gradle.archi' apply false

    // Current lineage pipeline and parser plugins
    id 'org.flowdigger.antlr' apply false
    id 'org.flowdigger.antlr.plsql' apply false
    id 'org.flowdigger.xml' apply false
    id 'org.flowdigger.python' apply false
    id 'org.flowdigger.ooxml' apply false
    id 'org.flowdigger.lineage'
}

version = '0.1.5'
group = 'org.flowdigger.example.lineage.plsql'

subprojects {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("projects/${project.path.substring(1).replace(':', '/')}"))
}

apply from: '3-lineage/lineage-pipeline.gradle'

subprojects {
    version = rootProject.version

    pluginManager.withPlugin('java') {
        apply plugin: 'org.owasp.dependencycheck'
        apply plugin: 'com.github.spotbugs'

        dependencies {
            spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
            constraints {
                implementation('org.apache.commons:commons-lang3:3.22.0')
                implementation('org.apache.logging.log4j:log4j-api:2.26.1')
                implementation('org.apache.logging.log4j:log4j-to-slf4j:2.26.1')
            }
        }

        spotbugs {
            toolVersion = '4.8.3'
        }

        dependencyCheck {
            formats = ['HTML', 'JSON', 'XML']
            failBuildOnCVSS = 7.0
            suppressionFile = rootProject.file('dependency-check-suppressions.xml').absolutePath
            skipConfigurations = ['spotbugs', 'spotbugsPlugins']
            nvd {
                apiKey = project.findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
            }
        }

        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
            ignoreFailures = providers.gradleProperty("spotbugsIgnoreFailures")
                    .map { it.toBoolean() }
                    .orElse(true)
                    .get()
            effort = com.github.spotbugs.snom.Effort.DEFAULT
            reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
            excludeFilter = rootProject.file('spotbugs-exclude.xml')
            reports.create('html') {
                required = true
            }
            reports.create('xml') {
                required = false
            }
        }
    }
}

def reportsDir = layout.buildDirectory.dir('reports')

ext.requireReportFiles = { List<File> files ->
    files.each { file ->
        if (!file.exists()) {
            throw new GradleException("Required artifact missing: ${file}")
        }
    }
}

ext.writeLifecycleReport = { String fileName, String title, List<String> lines ->
    def target = reportsDir.get().file(fileName).asFile
    target.parentFile.mkdirs()
    target.text = """<html><head><title>${title}</title></head><body><h1>${title}</h1><ul>${lines.collect { "<li>${it}</li>" }.join('')}</ul></body></html>"""
}

tasks.register('assembleArchitecture') {
    group = 'lineage'
    description = 'Assembles architecture artifacts from architecture project.'
    dependsOn(':architecture:assembleArchitecture')
}

tasks.register('generateLineage') {
    group = 'lineage'
    description = 'Generates lineage artifacts from application sources.'
    dependsOn(':lineage:generateLineage')
}

tasks.register('verifyExampleLineage') {
    group = 'verification'
    description = 'Verifies published lineage for the example customer procedure.'
    dependsOn(':lineage:verifyExampleLineage')
}

tasks.register('startKnowledgeGraph') {
    group = 'lineage'
    description = 'Prepares knowledge graph runtime prerequisites.'
    dependsOn(':knowledgeGraph:startKnowledgeGraph')
}

tasks.register('loadKnowledgeGraph') {
    group = 'lineage'
    description = 'Loads architecture and lineage artifacts into graph model.'
    dependsOn(':knowledgeGraph:loadKnowledgeGraph')
}

tasks.register('verifyKnowledgeGraph') {
    group = 'verification'
    description = 'Runs graph verification checks.'
    dependsOn(':knowledgeGraph:verifyKnowledgeGraph')
}

tasks.register('endToEndTest') {
    group = 'verification'
    description = 'Executes full architecture-to-lineage-to-graph scenario.'
    dependsOn(':knowledgeGraph:endToEndTest')
}
