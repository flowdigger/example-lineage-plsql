plugins {
    id 'base'
}

group = rootProject.group
version = rootProject.version

def lineageBuildRoot = rootProject.file(providers.gradleProperty('buildRoot')
        .orElse(providers.environmentVariable('LINEAGE_BUILD_ROOT'))
        .orElse(rootProject.layout.buildDirectory.dir('lineage-uniform').map { it.asFile.absolutePath })
        .get())
def reportsDir = rootProject.layout.buildDirectory.dir('reports')
def requireFiles = rootProject.ext.requireReportFiles
def writeReport = rootProject.ext.writeLifecycleReport

tasks.register('generateTableLineage') {
    group = 'lineage'
    description = 'Generates and publishes canonical table lineage.'
    dependsOn(':publishLineage')
}

tasks.register('generateLineage') {
    group = 'lineage'
    description = 'Generates lineage artifacts from application sources.'
    dependsOn(':application:prepareApplicationAssets', ':architecture:assembleArchitectureModel', ':publishLineage')

    def appDir = project(':application').layout.buildDirectory.dir('plsql-assets').get().asFile
    def lineageAstDir = new File(lineageBuildRoot, '1.parse/sql/application/ast')
    def lineageExtractDir = new File(lineageBuildRoot, '2.observe/sql/application')
    def publishedGraph = new File(lineageBuildRoot, '9.publish/artifacts/graphml/lineage.graphml')
    inputs.file(new File(appDir, 'application-assets.txt'))
    inputs.dir(lineageAstDir)
    inputs.dir(lineageExtractDir)
    inputs.file(publishedGraph)
    inputs.property('lineageBuildRoot', lineageBuildRoot.absolutePath)
    outputs.file(reportsDir.map { it.file('lineage-report.html') })
    doLast {
        requireFiles([new File(appDir, 'application-assets.txt'), publishedGraph])
        if (fileTree(lineageAstDir).matching { include '**/*.xir' }.isEmpty()
                || fileTree(lineageExtractDir).matching { include '**/*.xir' }.isEmpty()) {
            throw new GradleException("Lineage outputs missing or empty. Expected XIR files in: ${lineageAstDir}, ${lineageExtractDir}")
        }
        writeReport('lineage-report.html', 'Lineage Report', [
                "applicationAssets=${appDir}",
                "lineageAstDir=${lineageAstDir}",
                "lineageExtractDir=${lineageExtractDir}",
                "mode=gradle-lineage-plugin"
        ])
    }
}

tasks.register('verifyExampleLineage') {
    group = 'verification'
    description = 'Verifies published lineage for the example customer procedure.'
    dependsOn(':publishLineage')
    doLast {
        def astDir = new File(lineageBuildRoot, '1.parse/sql/application/ast')
        def observationsDir = new File(lineageBuildRoot, '2.observe/sql/application')
        def ast = fileTree(astDir).matching { include '**/procedure/load_customer_lineage.xir' }.files
        def observations = fileTree(observationsDir).matching { include '**/procedure/load_customer_lineage.xir' }.files
        if (ast.size() != 1 || observations.size() != 1) {
            throw new GradleException('Expected exactly one AST and observation for load_customer_lineage.')
        }
        def observation = observations.first().text
        if (!observation.contains('name "load_customer_lineage"')
                || !observation.contains('name "raw_customer"')
                || !observation.contains('name "valid_customer"')
                || !observation.contains('name "merged_customer"')) {
            throw new GradleException('Customer procedure observation is incomplete.')
        }

        def graphFile = new File(lineageBuildRoot, '9.publish/artifacts/graphml/lineage.graphml')
        requireFiles([graphFile])
        def graph = new groovy.xml.XmlSlurper().parse(graphFile)
        def edges = graph.depthFirst().findAll { it.name() == 'edge' }
                .collect { [it.@source.text(), it.@target.text()] } as Set
        def expected = [
                ['dsa.raw_customer', 'dsa.valid_customer'],
                ['dsa.customer_reference', 'dsa.valid_customer'],
                ['dsa.valid_customer', 'dsa.merged_customer']
        ]
        if (!edges.containsAll(expected)) {
            throw new GradleException("Published customer lineage is incomplete. Expected ${expected}, found ${edges}.")
        }
    }
}
